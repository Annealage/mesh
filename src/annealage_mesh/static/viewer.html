<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Annealage Mesh - STL review</title>
<link rel="stylesheet" href="/static/css/app.css">
<script type="importmap">
{ "imports": {
  "three": "/static/js/vendor/three.module.js"
} }
</script>
</head>
<body>

<div id="topbar">
  <span class="title">Annealage Mesh - STL review</span>
  <button id="modeBtn" title="Toggle pin/navigate mode">○ Navigate</button>
  <button id="fit" title="Fit view (F)">Fit</button>
  <button id="upBtn" title="Toggle which axis is 'up'">Z-up</button>
  <button id="panelBtn" title="Show/hide panel">☰ Panel</button>
</div>

<nav id="tabbar"></nav>

<div id="main">
  <div id="app"></div>

  <aside id="side">
    <header>
      <h1>Review</h1>
      <div class="sub">Drag to orbit · pinch to zoom · two-finger to pan. Switch to <b>Add pin</b> to drop comments.</div>
      <div class="legend">
        <label><input type="checkbox" id="tgAgent" checked><span class="dot agent"></span>Agent callouts (read-only)</label>
        <label><input type="checkbox" id="tgUser" checked><span class="dot user"></span>Your pins</label>
      </div>
    </header>
    <div id="parts-sec">
      <div class="sec-hdr">Parts</div>
      <div id="parts"></div>
    </div>
    <div id="measure-sec">
      <div class="sec-hdr">Measure</div>
      <div class="mrow">
        <select id="mA"><option value="">Pin A…</option></select>
        <select id="mB"><option value="">Pin B…</option></select>
      </div>
      <div id="mResult" class="mresult"><span class="empty">Pick two pins to measure.</span></div>
    </div>
    <div id="agentPins" class="agentsec"></div>
    <div id="pins"><div class="empty">No pins yet, tap “Add pin”, then tap a visible part.</div></div>
    <footer>
      <div class="rowbtns">
        <button id="clear">Clear all</button>
        <button id="submit" class="primary">Submit</button>
      </div>
      <div class="sub" id="status" style="color:#778;font-size:11px;">unsaved</div>
    </footer>
  </aside>
</div>

<div id="toast"></div>
<div id="err"></div>

<script type="module" src="/static/js/main.js"></script>
</body>
</html>
