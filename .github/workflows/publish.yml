name: publish

# Publishes to PyPI on a GitHub Release, using trusted publishing (OIDC) - no
# API token stored. To enable: create the "annealage-mesh" project on PyPI with
# a trusted publisher pointing at this repo + workflow (owner Annealage, repo
# mesh, workflow publish.yml), then cut a GitHub release. See RELEASING.md.

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # required for PyPI trusted publishing
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: build
        run: uv build
      - name: publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
