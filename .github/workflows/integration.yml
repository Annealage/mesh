name: integration

# On-demand only, by design: these tests drive real backend SDKs/binaries
# against real accounts and a real endpoint, spending real API/inference
# cost and depending on reachability this repo cannot guarantee. No
# `push`/`pull_request`/`workflow_call` trigger - a human must explicitly
# run this from the Actions tab (or `gh workflow run integration.yml`).
# See planning/tickets/phase7_live-integration-tests.md for the full design
# and exactly what each secret below is for.
#
# Repository (or environment) secrets this workflow expects, none of which
# it can provision itself:
#   MESH_LIVE_ANTHROPIC_API_KEY - Claude backend, API-key auth
#   MESH_LIVE_OPENAI_API_KEY    - Codex backend, logged into an isolated
#                                  CODEX_HOME the test itself creates
#   MESH_LIVE_OMP_BASE_URL      - the reachable OpenAI-compatible endpoint
#                                  the omp backend test talks to
#   MESH_LIVE_OMP_API_KEY       - optional; omit for a keyless endpoint
#   MESH_LIVE_OMP_EXECUTABLE    - absolute path, on this runner, to a real
#                                  `omp` binary - deliberately no bare-PATH
#                                  fallback (see the ticket for why)
# Optional overrides (repo variables, not secrets - not sensitive):
#   MESH_LIVE_CLAUDE_MODEL (default "haiku")
#   MESH_LIVE_CODEX_MODEL  (default "gpt-5.6-luna")
#   MESH_LIVE_OMP_MODEL    (default "qwen3.8-27b")
#
# A backend whose secret(s) are unset skips that backend's test rather than
# failing the job - see each live test file's own skipif reason.
#
# What this workflow deliberately does NOT do: install a real `omp`
# binary. This project has no verified, repeatable install path for it -
# unlike `openai-codex` and `omp-rpc`, it is not a Python package this
# repo's own dependency chain can pin a commit for (see session/omp.py's
# module docstring: omp-rpc is the Python *client*; `omp` itself is a
# separate binary distributed elsewhere). Before this workflow can pass its
# omp leg, whoever enables it must add a step here that installs a real
# `omp` build on the runner (matching whatever distribution channel is
# current - a curl-based installer, a container image, or a self-hosted
# runner with it already present) and set `MESH_LIVE_OMP_EXECUTABLE` to its
# resulting path. Until that step exists, the omp leg's secrets stay unset
# and it skips cleanly, same as running this locally without them.

on:
  workflow_dispatch:

jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml

      - name: install omp-rpc
        # Same pinned commit test.yml installs for the fake-transport omp
        # suite - see session/omp.py's module docstring for why this is a
        # manual step rather than a pyproject.toml extra.
        run: >-
          uv run --extra dev python -c "" &&
          uv pip install
          "omp-rpc @ git+https://github.com/can1357/oh-my-pi.git@71c5eec978b0e7ce9ff057eb4e311f67f4f03eb9#subdirectory=python/omp-rpc"

      - name: run the live integration tier
        env:
          MESH_LIVE_ANTHROPIC_API_KEY: ${{ secrets.MESH_LIVE_ANTHROPIC_API_KEY }}
          MESH_LIVE_OPENAI_API_KEY: ${{ secrets.MESH_LIVE_OPENAI_API_KEY }}
          MESH_LIVE_OMP_BASE_URL: ${{ secrets.MESH_LIVE_OMP_BASE_URL }}
          MESH_LIVE_OMP_API_KEY: ${{ secrets.MESH_LIVE_OMP_API_KEY }}
          MESH_LIVE_OMP_EXECUTABLE: ${{ secrets.MESH_LIVE_OMP_EXECUTABLE }}
          MESH_LIVE_CLAUDE_MODEL: ${{ vars.MESH_LIVE_CLAUDE_MODEL }}
          MESH_LIVE_CODEX_MODEL: ${{ vars.MESH_LIVE_CODEX_MODEL }}
          MESH_LIVE_OMP_MODEL: ${{ vars.MESH_LIVE_OMP_MODEL }}
        run: uv run --extra dev --extra codex pytest -m integration -q
