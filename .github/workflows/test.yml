name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      # Fail-fast off so one version's failure does not hide whether the others
      # pass, which is the whole reason for testing three of them.
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
          # The agent SDK is a base dependency and its wheel is about 90 MB,
          # because it bundles the Claude Code CLI. Downloading that once per
          # matrix leg per run is the single largest cost in this workflow, so
          # uv's own download cache is keyed on the lockfile-equivalent inputs
          # and restored before resolution. A miss costs what today costs; a hit
          # takes the SDK download out of the run entirely.
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: run tests
        run: uv run --extra dev pytest -q

      # The Python suite covers no JavaScript at all, so a syntax error in a
      # module under static/js/ leaves it entirely green while the viewer fails
      # to boot. This is two seconds and catches exactly that.
      - name: every browser module parses
        run: |
          for f in src/annealage_mesh/static/js/*.js \
                   src/annealage_mesh/static/js/vendor/*.js; do
            node --check "$f" || exit 1
          done

      # Agent mode requires bubblewrap and socat, and refuses to start without
      # them; the suite covers that refusal with a fixture rather than by
      # depending on what the runner has, so nothing here installs them. What
      # this step checks is that the refusal itself still happens on a host that
      # genuinely lacks them, which is what a user on a fresh machine meets
      # first, and which no amount of fixture-based testing can confirm.
      - name: agent mode refuses to start without the sandbox
        run: |
          mkdir -p /tmp/mesh-ci-empty
          set +e
          uv run --extra dev python -m annealage_mesh /tmp/mesh-ci-empty --no-open
          rc=$?
          set -e
          test "$rc" = "2" || { echo "expected exit 2, got $rc"; exit 1; }

  # Separate from the matrix above: this needs a chromium download, which is
  # larger than every other test dependency combined, so it runs once on one
  # Python rather than three times. It is the only job that exercises the front
  # end at all, which is why it is a job and not an optional extra nobody runs.
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: install chromium
        run: uv run --extra dev --extra e2e playwright install --with-deps chromium

      - name: run the browser suite
        run: uv run --extra dev --extra e2e pytest tests/test_viewer_e2e.py -q
