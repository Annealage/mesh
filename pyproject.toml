[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "annealage-mesh"
version = "0.1.0"
description = "Local web tool for pin-comment review of 3D-print STL models, by a human and an AI agent"
readme = "README.md"
requires-python = ">=3.9"
license = "PolyForm-Noncommercial-1.0.0"
license-files = ["LICENSE", "skill/annealage-mesh/LICENSE"]
authors = [
    { name = "Andrew Leech", email = "andrew@alelec.net" },
]
keywords = ["3d-printing", "stl", "review", "annotation", "three.js", "cad"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Intended Audience :: Manufacturing",
    "License :: Other/Proprietary License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Graphics :: 3D Modeling",
    "Topic :: Software Development :: Testing",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
annealage-mesh = "annealage_mesh.cli:main"

[project.urls]
Homepage = "https://github.com/Annealage/mesh"
Repository = "https://github.com/Annealage/mesh"

[tool.hatch.build.targets.wheel]
packages = ["src/annealage_mesh"]

[tool.hatch.build.targets.wheel.force-include]
"src/annealage_mesh/static/viewer.html" = "annealage_mesh/static/viewer.html"

[tool.hatch.build.targets.sdist]
include = [
    "src/annealage_mesh",
    "skill",
    "tests",
    "README.md",
    "LICENSE",
    "COMMERCIAL.md",
    "CONTRIBUTING.md",
    "REUSE.toml",
]
