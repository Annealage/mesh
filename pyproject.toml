[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "annealage-mesh"
dynamic = ["version"]
description = "Build 3D-printable parts with an agent: a local 3D viewer beside a chat pane, where regenerated models appear live and feedback is pinned to exact coordinates"
readme = "README.md"
requires-python = ">=3.10"
# The wheel ships the vendored three.js files (MIT, the three.js authors)
# beside this project's own PolyForm code, so the expression names both.
license = "PolyForm-Noncommercial-1.0.0 AND MIT"
license-files = [
    "LICENSE",
    "src/annealage_mesh/static/js/vendor/LICENSE",
    "skill/annealage-mesh/LICENSE",
]
authors = [
    { name = "Andrew Leech", email = "andrew@alelec.net" },
]
keywords = ["3d-printing", "stl", "review", "annotation", "three.js", "cad"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Intended Audience :: Manufacturing",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Graphics :: 3D Modeling",
    "Topic :: Software Development :: Testing",
]
# The embedded agent (sessions for the Claude, Codex and omp backends, the
# permission broker, the chat pane, /ws, /mcp and settings) is the separate
# annealage-agent package, which carries its own runtime dependencies (microdot,
# claude-agent-sdk, mcp, httpx, platformdirs, tomli) with the reasons for each.
#
# The floor matches annealage-agent's hatch-vcs fallback version (0.0.0): the
# package has no release yet, and uv resolves it from the git submodule
# lib/agent named in [tool.uv.sources] below. That source is a path, which
# cannot ship in this package's published metadata, so a Mesh release is
# blocked until annealage-agent is published (PyPI or a private index) and this
# floor names a real release.
dependencies = [
    "annealage-agent>=0.0.0",
    # Mesh's own tool modules (tools/*_tools.py) declare their tools with the
    # SDK's `@tool` decorator, a direct import of this project's code, so it
    # is declared here rather than relied on through annealage-agent. The
    # range is annealage-agent's own (its pyproject.toml says why: 0.2.136 is
    # the verified permission-broker contract, `<0.3` because `Transport` is
    # internal). The SDK's wheel bundles a ~300 MB `claude` binary, so an
    # install downloads roughly 90 MB of platform-specific wheel; this
    # package's own wheel stays pure Python and platform-independent.
    "claude-agent-sdk>=0.2.136,<0.3",
]

[project.optional-dependencies]
# pre-commit>=4.6: no upper cap, matching pytest-asyncio's own convention
# above - a stable CLI driver with no API this project imports, only ever
# invoked as `pre-commit` (CONTRIBUTING.md, .pre-commit-config.yaml).
#
# microdot: Mesh's own code never imports it (the app and Response it serves
# come from annealage-agent), but its tests do, directly (tests/conftest.py's
# TestClient, tests/test_routes_viewer.py's Request) and rely on its
# behaviour (TestClient's Host default, Request.create). A direct import of
# this project's code is declared here rather than relied on through
# annealage-agent, for the same reason as claude-agent-sdk above; the range
# is annealage-agent's own.
dev = ["pytest", "pytest-asyncio>=0.23", "pre-commit>=4.6", "microdot>=2.6,<3"]
# The browser suite, kept out of `dev` because it also needs a browser binary
# installed separately (`playwright install chromium`), which is a much larger
# download than the rest of the test dependencies put together. Declared rather
# than left to a manual install, because `tests/test_viewer_e2e.py` skips itself
# when playwright is absent, and those are the only tests that exercise the front
# end at all: undeclared, they are silently not run.
e2e = ["playwright"]

# Enhanced STL verification (watertight/volume/body analysis) in the
# mesh_verify MCP tool.  Without this extra the tool still returns basic
# geometry facts (triangle count, bounding box) from the package's own
# dependency-free STL reader, but open-edge counts, volume and body-count
# analysis need trimesh's mesh processing.  Kept optional because trimesh
# pulls in numpy (~20 MB) and the base install is otherwise pure-Python
# plus the Claude Agent SDK.  The agent's own CadQuery model scripts
# declare their deps via PEP-723 inline metadata and do not need this
# extra at all.
cad = ["trimesh", "numpy"]

# Optional, unlike claude-agent-sdk, because it is an alternative backend
# (the agent's `backend` setting) rather than the default: an install that
# only ever runs the Claude backend should not pay for a second CLI it will
# never invoke. The backend itself lives in annealage-agent, whose own `codex`
# extra pins the openai-codex SDK and says why the range is that tight; this
# extra only forwards to it, so `pip install "annealage-mesh[codex]"` keeps
# working. The SDK's wheel bundles a pinned CLI runtime of its own
# (`openai-codex-cli-bin`), so `uv sync --extra codex` downloads a second
# platform-specific binary on top of the base install.
codex = ["annealage-agent[codex]"]

[project.scripts]
annealage-mesh = "annealage_mesh.cli:main"

[project.urls]
Homepage = "https://github.com/Annealage/mesh"
Repository = "https://github.com/Annealage/mesh"

# The version is the git tag, resolved at build time, so there is no literal to
# keep in step with anything: `__init__.py` reads it back out of the installed
# package's own metadata. Two consequences worth knowing. A build needs the tags
# present, so CI checks out with fetch-depth: 0; and a build from an unpacked
# sdist, which is what `uv build` does for the wheel, has no .git and resolves
# the version from the sdist's PKG-INFO instead.
[tool.hatch.version]
source = "vcs"
# A checkout with no tags at all, which a shallow clone or a source tarball
# produces, would otherwise fail the build outright.
fallback-version = "0.0.0"

[tool.hatch.version.raw-options]
# PyPI rejects a local version segment, and the default scheme appends one
# (+g<sha>) to any commit that is not exactly a tag. A release is built on the
# tag and so carries none either way; this makes an off-tag build uploadable
# rather than silently unpublishable.
local_scheme = "no-local-version"

[tool.hatch.build.targets.wheel]
packages = ["src/annealage_mesh"]

[tool.hatch.build.targets.sdist]
include = [
    "src/annealage_mesh",
    "skill",
    "tests",
    "tools",
    "README.md",
    "LICENSE",
    "LICENSES",
    "COMMERCIAL.md",
    "CONTRIBUTING.md",
    "REUSE.toml",
]

# hatchling applies the repo .gitignore to package contents by default, so a
# static/ subdirectory whose name matches a gitignore pattern (this repo's
# .gitignore has "lib/", "build/", "parts/" and "var/") would silently drop
# out of both the sdist and the wheel. "artifacts" bypasses that VCS-ignore
# filtering, so everything under static/ ships regardless of directory
# naming (the agent's own front end, served at /agent/static/, ships in
# annealage-agent's wheel, not this one). Both the sdist and the wheel targets
# need this entry: the release workflow (.github/workflows/publish.yml) runs
# plain `uv build`, which builds the wheel from the sdist it just produced
# rather than from the working tree, so a wheel-only override here would ship
# a wheel with the assets during local `--wheel` testing while the published
# wheel, built from an sdist missing them, would silently drop them again.
[tool.hatch.build]
artifacts = [
    "src/annealage_mesh/static/**",
]

# annealage-agent is the git submodule lib/agent, and uv installs it from
# there, editable: the commit the gitlink pins is the agent Mesh runs, in a
# checkout and in CI (which checks submodules out). tools/bump-agent.sh moves
# it. A path source is uv-only and never reaches published metadata.
[tool.uv.sources]
annealage-agent = { path = "lib/agent", editable = true }

# Ruff is the linter and the formatter for this project. Its F rules are
# pyflakes, which is the check this codebase is written against; every other
# family below is selected deliberately rather than left to whatever a future
# ruff release decides to default to, since the default set has grown before.
[tool.ruff]
# The code is written to roughly 80 columns by hand; 100 is the width that keeps
# the formatter from rewrapping prose-heavy refusal messages that are laid out
# to be read, while still catching a genuinely runaway line.
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "F",      # pyflakes: what this project already enforced
    "E", "W", # pycodestyle, less E501: see the ignore list
    "I",      # import order
    "B",      # bugbear: mutable defaults, loop-variable capture, raise-from
    "ASYNC",  # blocking calls inside async functions
    "C4",     # comprehension rewrites
    "RET",    # return-path simplifications
    "PIE",    # small redundancies
    "PERF",   # obvious O(n) mistakes in loops
]
# `UP` is deliberately absent. It wants 300-odd rewrites of `%` formatting into
# f-strings and every `Optional[X]` into `X | None`; both are the house style
# here, and a rule family that has to be half-ignored to be adopted is a rule
# family that is not being enforced.
ignore = [
    # `ruff format` is the authority on line length for code, and it has already
    # wrapped everything it can. What E501 is left reporting is prose inside
    # docstrings that the formatter deliberately does not touch, so enforcing it
    # would mean rewrapping paragraphs rather than fixing lines.
    "E501",
    # try/except/pass with a comment explaining what is being swallowed and why
    # is this codebase's idiom for a best-effort cleanup; contextlib.suppress
    # would move that comment away from the call it explains.
    "SIM105",
    # The three PERF rules that are micro-optimisation advice rather than
    # mistake-finding, and that here would each make the code worse: two of the
    # loops they flag mutate a dict that already exists, which no comprehension
    # can do; the rest are guard-clause loops that read better than the
    # comprehension equivalent; and the one try inside a loop is there precisely
    # so that one unparseable message cannot end a conversation. PERF102, which
    # catches iterating a dict's items when only the values are used, stays on.
    "PERF203",
    "PERF401",
    "PERF403",
]

[tool.ruff.lint.per-file-ignores]
# Tests deliberately open files without a context manager to hold a descriptor
# across an assertion, call blocking file APIs inside async tests, and spawn
# a real subprocess with blocking `subprocess.Popen` (rather than
# `asyncio.create_subprocess_exec`) to exercise its actual stdin/exit
# behaviour end to end - in every case there is no event loop to starve but
# the test's own.
"tests/*" = ["ASYNC220", "ASYNC230", "ASYNC240"]
