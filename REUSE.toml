version = 1

# Per-file licensing map for Annealage Mesh (REUSE 3.0).
# Authoritative, machine-readable companion to the LICENSE files. Resolves
# the licence of any path, including files that cannot carry an inline SPDX
# header (images, JSON, lockfiles, LICENSE itself).

# The repository is PolyForm Noncommercial 1.0.0 by default.
# precedence = "aggregate" means this applies to any file that does not
# declare its own licensing information via header.
[[annotations]]
path = "**/*"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Andrew Leech"
SPDX-License-Identifier = "PolyForm-Noncommercial-1.0.0"

# The Claude Code skill is MIT so it can be copied into any agent
# configuration without restriction. precedence = "override" beats the
# repository-wide aggregate above.
[[annotations]]
path = "skill/annealage-mesh/**"
precedence = "override"
SPDX-FileCopyrightText = "2026 Andrew Leech"
SPDX-License-Identifier = "MIT"

# Vendored browser dependencies: byte-for-byte copies of upstream releases,
# not our work and not under the repository licence. Provenance, versions and
# hashes are recorded in the directory's own VERSIONS.json, and
# tools/refresh-vendor.sh is the only thing that should ever write here.
[[annotations]]
path = "src/annealage_mesh/static/js/vendor/**"
precedence = "override"
SPDX-FileCopyrightText = "2010-2023 three.js authors"
SPDX-License-Identifier = "MIT"
